<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Netuno</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .login-page{
            min-height: calc(100vh - 130px);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .login-card{
            width:100%;
            max-width:450px;

            background: rgba(11,31,54,0.6);

            border:1px solid #1f3e67;
            border-radius:16px;

            padding:40px;

            box-shadow: 0 4px 32px rgba(0,170,255,.08);

            transition:.3s;
        }

        .login-card:hover{
            border-color:#00aaff;
            box-shadow:0 15px 45px rgba(0,170,255,.25);
        }

        .login-logo{
            display:flex;
            justify-content:center;
            margin-bottom:20px;
        }

        .login-logo img{
            width:100px;
        }

        .login-title{
            font-family:"Cinzel", serif;
            color:white;
            text-align:center;
            font-size:2rem;
            margin-bottom:10px;
        }

        .login-subtitle{
            text-align:center;
            color:#00aaff;
            margin-bottom:30px;
            font-family:"Lato", sans-serif;
        }

        .input-group{
            display:flex;
            flex-direction:column;
            margin-bottom:20px;
        }

        .input-group label{
            color:white;
            margin-bottom:8px;
            font-family:"Lato", sans-serif;
        }

        .input-group input{
            background:#0a1a2f;
            border:1px solid #1f3e67;
            color:white;

            padding:14px;
            border-radius:10px;

            outline:none;

            transition:.3s;
        }

        .input-group input:focus{
            border-color:#00aaff;
            box-shadow:0 0 12px rgba(0,170,255,.4);
        }

        .input-group input::placeholder{
            color:#64b5f6;
        }

        .login-options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
            font-family:"Lato", sans-serif;
        }

        .login-options label{
            color:#64b5f6;
            font-size:.9rem;
        }

        .login-options a{
            color:#00aaff;
            text-decoration:none;
        }

        .login-options a:hover{
            color:#00ccff;
        }

        .btn-login{
            width:100%;
            background:#00aaff;
            color:white;

            border:none;
            border-radius:30px;

            padding:14px;

            font-size:1rem;
            cursor:pointer;

            transition:.3s;
        }

        .btn-login:hover{
            background:#00ccff;
            transform:translateY(-2px);
        }

        .voltar{
            text-align:center;
            margin-top:25px;
        }

        .voltar a{
            color:#64b5f6;
            text-decoration:none;
            font-family:"Lato", sans-serif;
        }

        .voltar a:hover{
            color:#00aaff;
        }

    </style>
</head>

<body>

<header>
    <div class="container header-container">

        <a href="index.html">
            <img src="assets/img/Logo_Netuno.png" class="logo">
        </a>

        <h1 class="nome_empresa">NETUNO</h1>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="servicos.html">Serviços</a></li>
                <li><a href="projeto.html">Projetos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>

    </div>
</header>

<main>

    <section class="login-page">

        <div class="login-card">

            <div class="login-logo">
                <img src="assets/img/Logo_Netuno.png" alt="Netuno">
            </div>

            <h1 class="login-title">
                Área do Cliente
            </h1>

            <p class="login-subtitle">
                Acesse seu projeto e acompanhe seu desenvolvimento
            </p>

            <form action="dashboard.html">

                <div class="input-group">
                    <label>E-mail</label>
                    <input
                        type="email"
                        placeholder="Digite seu e-mail"
                        required>
                </div>

                <div class="input-group">
                    <label>Senha</label>
                    <input
                        type="password"
                        placeholder="Digite sua senha"
                        required>
                </div>

                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Lembrar-me
                    </label>
                  
                    
                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>

                  <br>
                <div class="troca-form">
                    <p>
                        Não possui cadastro? <br>
                        <a href="cadastro.html">Criar conta</a>
                    </p>
                </div>

            </form>

            <div class="voltar">
                <a href="index.html">
                    ← Voltar ao site
                </a>
            </div>

        </div>

    </section>

</main>

<footer>
    <h6>Reservado por Todos os direitos</h6>
</footer>

</body>
</html>
